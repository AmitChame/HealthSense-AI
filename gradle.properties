# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress AGP 8.5.2 warning: compileSdk=35 is supported in practice.
# AGP 8.5.2 was tested to SDK 34, but SDK 35 compiles and runs correctly.
# Update AGP to 8.7+ when available to remove this suppressor.
android.suppressUnsupportedCompileSdk=35
