# HealthSense AI Evidence & Standards Knowledge Base
# Schema Version: 1.0.0
# Last Reviewed: 2026-09-20
#
# RULE: Every record must be derived from an authoritative source:
#   WHO (World Health Organization)
#   Codex Alimentarius (FAO/WHO)
#   FSSAI (Food Safety and Standards Authority of India)
#   ICMR-NIN (Indian Council of Medical Research - National Institute of Nutrition)
#   US FDA (Food and Drug Administration)
#   EFSA (European Food Safety Authority)
#
# If a value cannot be directly verified, it is marked evidence_status: NEEDS_VALIDATION.

metadata:
  version: "1.0.0"
  last_updated: "2026-09-20"
  supported_jurisdictions: ["GLOBAL", "IN", "US", "EU"]
  hierarchy:
    - "WHO"
    - "CODEX"
    - "NATIONAL_STATUTORY_BODIES" # FSSAI, FDA, EFSA
    - "PEER_REVIEWED_CONSENSUS"

standards:
  # ─── FREE SUGARS ─────────────────────────────────────────────────────────────
  - evidence_id: "EVID_WHO_SUGARS_2015"
    source_organization: "WHO"
    source_document: "Guideline: Sugars intake for adults and children (2015)"
    source_url: "https://www.who.int/publications/i/item/9789241549028"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ALL_EXCEPT_INFANTS"
    nutrient_or_parameter: "free_sugars"
    maximum: 10.0 # < 10% of total energy intake (Strong recommendation)
    target: 5.0   # < 5% of total energy intake (Conditional recommendation for additional health benefits)
    unit: "PERCENT_ENERGY"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "Adults and children aged >= 2 years"
    effective_date: "2015-03-04"
    review_date: "2024-01-01"
    notes: "Free sugars include monosaccharides and disaccharides added to foods by manufacturer/cook/consumer plus naturally present in honey, syrups, fruit juices and fruit juice concentrates. Does not include intrinsic sugars in whole fresh fruits/vegetables or milk."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_FDA_ADDED_SUGARS_DV"
    source_organization: "FDA"
    source_document: "21 CFR 101.9 Nutrition Labelling of Food"
    source_url: "https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfcfr/cfrsearch.cfm?fr=101.9"
    jurisdiction: "US"
    population: "GENERAL"
    life_stage: "ADULT"
    nutrient_or_parameter: "added_sugars"
    target: 50.0
    unit: "g"
    basis: "PER_DAY"
    standard_type: "NUTRIENT_REFERENCE"
    rule_type: "DAILY_VALUE"
    applicability: "General population 4 years and older based on 2,000 kcal reference diet"
    effective_date: "2020-01-01"
    notes: "FDA Daily Value for added sugars is 50g per day (10% of 2,000 kcal diet)."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_ICMR_NIN_SUGARS_2024"
    source_organization: "ICMR-NIN"
    source_document: "Dietary Guidelines for Indians (2024)"
    source_url: "https://www.nin.res.in/dietaryguidelines/"
    jurisdiction: "IN"
    population: "INDIAN"
    life_stage: "ADULT"
    nutrient_or_parameter: "added_sugars"
    maximum: 25.0 # Up to 20-25g per day for normal healthy adult
    unit: "g"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "Sedentary adult Indian population"
    effective_date: "2024-05-08"
    notes: "ICMR-NIN 2024 recommends limiting added sugar to less than 20-25g per day for adults, and avoiding added sugar entirely for children under 2 years."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── SODIUM ─────────────────────────────────────────────────────────────────
  - evidence_id: "EVID_WHO_SODIUM_2023"
    source_organization: "WHO"
    source_document: "WHO Global report on sodium intake reduction (2023)"
    source_url: "https://www.who.int/publications/i/item/9789240069985"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ADULT"
    nutrient_or_parameter: "sodium"
    maximum: 2000.0 # < 2,000 mg/day equivalent to < 5g salt/day
    unit: "mg"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "Adults aged >= 16 years"
    effective_date: "2012-12-01"
    review_date: "2023-03-09"
    notes: "WHO strongly recommends a reduction in sodium intake to < 2,000 mg/day (5 g/day of salt) in adults. For children, the recommended maximum level of 2,000 mg/day should be adjusted downward based on energy requirements."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_WHO_SODIUM_CHILDREN"
    source_organization: "WHO"
    source_document: "Guideline: Sodium intake for adults and children (2012)"
    source_url: "https://www.who.int/publications/i/item/9789241504836"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "CHILD"
    nutrient_or_parameter: "sodium"
    maximum: 1500.0 # Adjusted downward for children based on energy requirement
    unit: "mg"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "Children aged 2 to 15 years"
    effective_date: "2012-12-01"
    notes: "Sodium limit for children is adjusted proportional to energy requirement (roughly 1,200mg for young children, 1,500mg for school-age, 1,800mg for adolescents)."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_FDA_SODIUM_DV"
    source_organization: "FDA"
    source_document: "21 CFR 101.9 Nutrition Labelling of Food"
    source_url: "https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfcfr/cfrsearch.cfm?fr=101.9"
    jurisdiction: "US"
    population: "GENERAL"
    life_stage: "ADULT"
    nutrient_or_parameter: "sodium"
    target: 2300.0
    unit: "mg"
    basis: "PER_DAY"
    standard_type: "NUTRIENT_REFERENCE"
    rule_type: "DAILY_VALUE"
    applicability: "General population 4 years and older"
    effective_date: "2020-01-01"
    notes: "FDA Daily Value for sodium is 2,300 mg per day."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── SATURATED & TRANS FATTY ACIDS ──────────────────────────────────────────
  - evidence_id: "EVID_WHO_SFA_2023"
    source_organization: "WHO"
    source_document: "Saturated fatty acid and trans-fatty acid intake for adults and children: WHO guideline (2023)"
    source_url: "https://www.who.int/publications/i/item/9789240073630"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ALL_EXCEPT_INFANTS"
    nutrient_or_parameter: "saturated_fat"
    maximum: 10.0 # < 10% of total energy intake
    unit: "PERCENT_ENERGY"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "Adults and children aged >= 2 years"
    effective_date: "2023-07-17"
    notes: "WHO recommends that adults and children reduce saturated fatty acid intake to 10% of total energy intake or less, replacing with polyunsaturated and monounsaturated fatty acids."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_WHO_TFA_2023"
    source_organization: "WHO"
    source_document: "Saturated fatty acid and trans-fatty acid intake for adults and children: WHO guideline (2023)"
    source_url: "https://www.who.int/publications/i/item/9789240073630"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "trans_fat"
    maximum: 1.0 # < 1% of total energy intake
    unit: "PERCENT_ENERGY"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "POPULATION_INTAKE"
    applicability: "All age groups"
    effective_date: "2023-07-17"
    notes: "WHO recommends reducing trans-fatty acid intake to less than 1% of total energy intake. Global target: eliminate industrially produced trans-fats (iTFA < 2g per 100g total fat/oil)."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_FSSAI_TRANS_FAT_LIMIT"
    source_organization: "FSSAI"
    source_document: "Food Safety and Standards (Prohibition and Restrictions on Sales) Second Amendment Regulations, 2021"
    jurisdiction: "IN"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "trans_fat"
    maximum: 2.0 # Not more than 2% by weight of total fat
    unit: "PERCENT_OF_TOTAL_FAT"
    basis: "PER_100G"
    standard_type: "REGULATORY_CLAIM"
    rule_type: "STATUTORY_LIMIT"
    applicability: "All food products containing fats and oils sold in India"
    effective_date: "2022-01-01"
    notes: "FSSAI limits industrial trans-fatty acids to not more than 2% of total oil/fat in the product."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── CODEX CHOCOLATE COMPOSITION STANDARDS ──────────────────────────────────
  - evidence_id: "EVID_CODEX_CHOCOLATE_CXS87"
    source_organization: "CODEX"
    source_document: "Codex Standard for Chocolate and Chocolate Products (CXS 87-1981, Rev. 2016)"
    source_url: "https://www.fao.org/fao-who-codexalimentarius/codex-texts/standards/en/"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "cocoa_solids"
    minimum: 35.0 # At least 35% total cocoa solids
    unit: "PERCENT"
    basis: "PER_100G"
    food_category: "chocolate"
    standard_type: "FOOD_COMPOSITION_STANDARD"
    rule_type: "COMPOSITION_REQUIREMENT"
    applicability: "Products labeled as Chocolate / Dark Chocolate"
    effective_date: "2016-01-01"
    notes: "Chocolate must contain on a dry matter basis not less than 35% total cocoa solids, of which not less than 18% shall be cocoa butter and not less than 14% fat-free cocoa solids. Note: This is a product composition standard, NOT a health recommendation."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_CODEX_MILK_CHOCOLATE_CXS87"
    source_organization: "CODEX"
    source_document: "Codex Standard for Chocolate and Chocolate Products (CXS 87-1981, Rev. 2016)"
    source_url: "https://www.fao.org/fao-who-codexalimentarius/codex-texts/standards/en/"
    jurisdiction: "GLOBAL"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "cocoa_solids"
    minimum: 25.0 # At least 25% total cocoa solids
    unit: "PERCENT"
    basis: "PER_100G"
    food_category: "milk_chocolate"
    standard_type: "FOOD_COMPOSITION_STANDARD"
    rule_type: "COMPOSITION_REQUIREMENT"
    applicability: "Products labeled as Milk Chocolate"
    effective_date: "2016-01-01"
    notes: "Milk chocolate shall contain on a dry matter basis not less than 25% total cocoa solids and not less than 12-14% total milk solids."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_FSSAI_CHOCOLATE_2011"
    source_organization: "FSSAI"
    source_document: "Food Safety and Standards (Food Products Standards and Food Additives) Regulations, 2011 (Section 2.7.4)"
    jurisdiction: "IN"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "cocoa_solids"
    minimum: 35.0
    unit: "PERCENT"
    basis: "PER_100G"
    food_category: "chocolate"
    standard_type: "FOOD_COMPOSITION_STANDARD"
    rule_type: "COMPOSITION_REQUIREMENT"
    applicability: "Products sold as Chocolate in India"
    effective_date: "2011-08-01"
    notes: "FSSAI Section 2.7.4 defines standards for chocolate: min 35% total cocoa solids on dry basis, min 18% cocoa butter."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── PEDIATRIC & CHILD SAFETY STANDARDS ──────────────────────────────────────
  - evidence_id: "EVID_AAP_WHO_YOUNG_CHILD_SUGAR"
    source_organization: "WHO"
    source_document: "WHO Guideline on Sugars (2015) & American Academy of Pediatrics (AAP) Guidance (2019)"
    jurisdiction: "GLOBAL"
    population: "YOUNG_CHILDREN"
    life_stage: "YOUNG_CHILD" # Age < 2-4
    nutrient_or_parameter: "added_sugars"
    maximum: 0.0 # 0g added sugar recommended for under 2 years; strictly minimal for 2-4 years
    unit: "g"
    basis: "PER_SERVING"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "PEDIATRIC_RESTRICTION"
    applicability: "Children aged under 4 years"
    effective_date: "2019-03-25"
    notes: "Authoritative pediatric consensus recommends zero added sugars for children under 2 years, and minimal added sugars (< 15g/day total) for children aged 2-4."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_EFSA_CAFFEINE_CHILDREN"
    source_organization: "EFSA"
    source_document: "Scientific Opinion on the safety of caffeine (EFSA Journal 2015;13(5):4102)"
    source_url: "https://www.efsa.europa.eu/en/efsajournal/pub/4102"
    jurisdiction: "EU"
    population: "CHILDREN_ADOLESCENTS"
    life_stage: "CHILD"
    nutrient_or_parameter: "caffeine"
    maximum: 3.0 # mg per kg body weight per day
    unit: "mg_per_kg_bw"
    basis: "PER_DAY"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "SAFE_INTAKE_LEVEL"
    applicability: "Children aged 3 to 17 years"
    effective_date: "2015-05-27"
    notes: "EFSA opinion: Single and daily doses of caffeine up to 3 mg/kg body weight per day do not raise safety concerns for children and adolescents. Energy drinks typically exceed safe single-dose thresholds for children under 12."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── CHRONIC CONDITIONS EVIDENCE ───────────────────────────────────────────
  - evidence_id: "EVID_ADA_DIABETES_SUGAR_2024"
    source_organization: "ADA"
    source_document: "American Diabetes Association Standards of Care in Diabetes (2024)"
    source_url: "https://diabetesjournals.org/care/issue/47/Supplement_1"
    jurisdiction: "GLOBAL"
    population: "DIABETES"
    life_stage: "ADULT"
    nutrient_or_parameter: "sugars_100g"
    maximum: 10.0 # Per 100g packaged threshold for caution
    unit: "g"
    basis: "PER_100G"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "CONDITION_MANAGEMENT"
    applicability: "Individuals with Type 1, Type 2, or Gestational Diabetes"
    effective_date: "2024-01-01"
    notes: "Evidence: Foods with high refined sugar content produce rapid glycemic excursions. For packaged snacks, products exceeding 10-12g/100g free sugar require caution/portion restriction for glycemic control."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_AHA_HYPERTENSION_SODIUM_2023"
    source_organization: "AHA"
    source_document: "American Heart Association Dietary Recommendations for Sodium (2023)"
    source_url: "https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/sodium"
    jurisdiction: "US"
    population: "HYPERTENSION"
    life_stage: "ADULT"
    nutrient_or_parameter: "sodium_100g"
    maximum: 400.0 # mg per 100g for high sodium designation
    unit: "mg"
    basis: "PER_100G"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "CONDITION_MANAGEMENT"
    applicability: "Individuals with hypertension or prehypertension"
    effective_date: "2023-05-01"
    notes: "AHA recommends an ideal limit of no more than 1,500 mg per day for adults with high blood pressure. Foods with > 400mg sodium per 100g are classified as high sodium."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  - evidence_id: "EVID_NCEP_ATP_III_CHOLESTEROL"
    source_organization: "NCEP"
    source_document: "National Cholesterol Education Program ATP III / AHA Dietary Guidance (2021)"
    jurisdiction: "GLOBAL"
    population: "HIGH_CHOLESTEROL"
    life_stage: "ADULT"
    nutrient_or_parameter: "saturated_fat_100g"
    maximum: 4.0 # g per 100g packaged food limit
    unit: "g"
    basis: "PER_100G"
    standard_type: "HEALTH_GUIDELINE"
    rule_type: "CONDITION_MANAGEMENT"
    applicability: "Individuals with hypercholesterolemia or elevated LDL-C"
    effective_date: "2021-11-02"
    notes: "Saturated fat should be limited to 5-6% of total calories for individuals needing LDL-C reduction. In packaged foods, > 4g/100g saturated fat is high density."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "1.0"

  # ─── RENAL / CHRONIC KIDNEY DISEASE (CKD) DIET GUIDANCE ────────────────────
  - evidence_id: "EVID_KDIGO_CKD_NUTRITION_2020"
    source_organization: "KDIGO / KDOQI"
    source_document: "KDOQI Clinical Practice Guideline for Nutrition in CKD: 2020 Update"
    source_url: "https://www.kidney.org/professionals/guidelines/nutrition-ckd"
    jurisdiction: "GLOBAL"
    population: "CHRONIC_KIDNEY_DISEASE"
    life_stage: "ADULT"
    nutrient_or_parameter: "renal_diet_profile"
    standard_type: "CLINICAL_GUIDELINE"
    rule_type: "INSUFFICIENT_INFORMATION_NOTICE"
    applicability: "Individuals with documented Chronic Kidney Disease (Stages 1-5, dialysis, kidney transplant)"
    effective_date: "2020-09-01"
    notes: "Renal dietary requirements are highly individualized and depend critically on clinical parameters not present on standard food labels: CKD stage, serum potassium, serum phosphorus, degree of proteinuria, dialysis status, and acid-base balance. Packaged food nutrition panels typically omit potassium and bioavailable phosphorus additives. Therefore, commercial food composition information alone is legally and clinically INSUFFICIENT to determine food safety for kidney disease. Explicit clinical guidance from a nephrologist or specialized renal dietitian is mandatory."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "2.0"

  # ─── WHO EUROPE NUTRIENT PROFILE MODEL (POLICY CONTEXT) ────────────────────
  - evidence_id: "EVID_WHO_EURO_NPM_2023"
    source_organization: "WHO Regional Office for Europe"
    source_document: "WHO Regional Office for Europe nutrient profile model: second edition (2023)"
    source_url: "https://www.who.int/europe/publications/i/item/9789289058919"
    jurisdiction: "EU"
    population: "CHILDREN"
    life_stage: "CHILD"
    nutrient_or_parameter: "marketing_to_children_thresholds"
    standard_type: "POLICY_REGULATION"
    rule_type: "MARKETING_RESTRICTION"
    applicability: "Food marketing to children and public procurement policies"
    effective_date: "2023-03-01"
    notes: "The WHO Europe Nutrient Profile Model was developed specifically to assist governments in identifying foods permitted to be marketed to children. Thresholds are policy-specific and category-dependent. Applying these thresholds as a universal diagnostic that a food is 'healthy' or 'unhealthy' for general adult consumption is scientifically invalid and outside the model's intended policy scope."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "2.0"

  # ─── USDA FOODDATA CENTRAL COMPOSITIONAL REFERENCE ─────────────────────────
  - evidence_id: "EVID_USDA_FDC_REFERENCE"
    source_organization: "USDA"
    source_document: "USDA FoodData Central Foundation and Standard Reference Legacy Datasets"
    source_url: "https://fdc.nal.usda.gov/"
    jurisdiction: "US"
    population: "GENERAL"
    life_stage: "ALL"
    nutrient_or_parameter: "whole_food_composition"
    standard_type: "ANALYTICAL_DATABASE"
    rule_type: "COMPOSITIONAL_BASELINE"
    applicability: "Reference compositional baselines for unprocessed and whole commodities"
    effective_date: "2023-10-01"
    notes: "Official USDA analytical baseline data provides transparent laboratory-measured nutrient densities for whole foods (raw fruits, vegetables, oats, whole grains, nuts) used for benchmarking processing levels and nutrient adequacy."
    evidence_status: "OFFICIAL_ACTIVE"
    version: "2.0"

