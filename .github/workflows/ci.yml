name: HealthSense AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Django AI Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: |
          python manage.py check
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-testing-secret-key-not-for-production"
          ALLOWED_HOSTS: "*"

      - name: Run automated test suite (pytest)
        run: |
          pytest -v
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-testing-secret-key-not-for-production"

  android-ci:
    name: Android Application Unit Tests (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Provide template google-services.json for CI
        run: |
          cp app/google-services.json.template app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
